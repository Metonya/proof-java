# Explicit license selection for dual-licensed dependencies (D-44).
#
# JavaParser is dual-licensed 'LGPL-3.0 OR Apache-2.0'. Its pom lists LGPL
# first, so license-maven-plugin picks that one and the hard-rule-9 gate
# fires. coverdict exercises the Apache-2.0 option - a choice the root
# pom's dependency comment already records and RESEARCH.md justifies. This
# file makes that election explicit and machine-readable instead of leaving
# it as prose the inventory contradicts.
#
# This is a license ELECTION on a genuinely dual-licensed artifact, never a
# way to silence the gate: a single-licensed LGPL dependency has no Apache
# option to elect and must still fail the build (D-20).
com.github.javaparser--javaparser-core--3.26.2=Apache License, Version 2.0
com.github.javaparser--javaparser-symbol-solver-core--3.26.2=Apache License, Version 2.0

# Javassist is triple-licensed 'Apache-2.0 OR LGPL-2.1 OR MPL-1.1' (a
# transitive dependency of javaparser-symbol-solver-core). The plugin
# happens to pick Apache-2.0 because its pom lists that first, so the gate
# passes today by ordering luck rather than by decision. Recorded
# explicitly so a reordering upstream cannot silently change which license
# coverdict is shipping under.
org.javassist--javassist--3.30.2-GA=Apache License 2.0
